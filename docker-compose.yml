version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: blendpilot-postgres
    restart: always
    environment:
      POSTGRES_USER: blendpilot
      POSTGRES_PASSWORD: blendpilot
      POSTGRES_DB: blendpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
